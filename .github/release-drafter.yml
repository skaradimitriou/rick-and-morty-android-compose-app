name-template: 'v$RESOLVED_VERSION 📱🚀'
tag-template: 'v$RESOLVED_VERSION'
categories:
  - title: '🚀 Features'
    labels:
      - 'feature'
      - 'enhancement'
  - title: '🐛 Bug Fixes'
    labels:
      - 'fix'
      - 'bugfix'
      - 'bug'
  - title: '🧰 Maintenance'
    labels:
      - 'renovate'
      - 'update'
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
include-pre-releases: true
template: |
  ## Changes

  $CHANGES
